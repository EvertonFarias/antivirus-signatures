name: Atualizar base de assinaturas

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 03:17 UTC
  workflow_dispatch:

# contents: commit da base pequena; pages/id-token: publicar o site (com a lista de domínios).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-signatures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A chave privada fica no Environment "assinatura", liberado só para o branch main.
    # Outros branches, forks e PRs (inclusive do Dependabot) não conseguem lê-la.
    environment: assinatura
    steps:
      # Actions fixadas por commit: uma tag pode ser movida para código malicioso, um commit não.
      # O Dependabot (.github/dependabot.yml) abre PR quando sair versão nova.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # ESET malware-ioc (BSD-2) + Echap stalkerware-indicators (CC BY 4.0)
      - name: Montar a base com as fontes publicas
        run: python3 scripts/update_db.py

      # Phishing.Database (MIT) + sites de stalkerware (Echap). Se falhar, o site mantém a lista anterior.
      - name: Montar a lista de dominios
        id: domains
        continue-on-error: true
        run: python3 scripts/build_domains.py

      # Assina todo dia, mesmo sem novidades (e mesmo se uma fonte falhar): a data em
      # "#version=" prova ao app que a base está viva. Se ela passar de 7 dias, o app avisa
      # que alguém pode estar bloqueando as atualizações.
      - name: Assinar
        if: ${{ !cancelled() }}
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret SIGNING_PRIVATE_KEY não configurado no Environment 'assinatura'"
            exit 1
          fi
          umask 077
          mkdir -p keys
          printf '%s' "$SIGNING_PRIVATE_KEY" > keys/signing-private.key
          java tools/SignDb.java sign sha256.txt
          if [ -f domains.bin ]; then java tools/SignDb.java signfile domains.bin; fi
          rm -rf keys

      # Só a base pequena vai para o histórico do Git; a lista de domínios (~3 MB) vai direto
      # para o site, para o repositório não crescer 1 GB por ano.
      - name: Guardar a base no historico
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sha256.txt sha256.txt.sig
          git commit -m "Atualiza base de assinaturas"
          git push

      - name: Montar o site
        if: ${{ !cancelled() }}
        run: |
          mkdir -p _site
          cp sha256.txt sha256.txt.sig *.html _site/
          touch _site/.nojekyll
          if [ -f domains.bin ] && [ -f domains.bin.sig ]; then
            cp domains.bin domains.bin.sig _site/
          else
            # Fonte fora do ar hoje: republica a lista de ontem (já assinada).
            curl -fsSL -o _site/domains.bin https://evertonfarias.github.io/antivirus-signatures/domains.bin || true
            curl -fsSL -o _site/domains.bin.sig https://evertonfarias.github.io/antivirus-signatures/domains.bin.sig || true
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
