name: Atualizar base de assinaturas

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 03:17 UTC
  workflow_dispatch:
    inputs:
      force_sign:
        description: "Assinar e publicar mesmo sem hashes novos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-signatures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Buscar hashes novos
        id: fetch
        env:
          MB_AUTH_KEY: ${{ secrets.MB_AUTH_KEY }}
        run: python3 scripts/update_db.py

      - name: Assinar e publicar
        if: steps.fetch.outputs.changed == 'true' || inputs.force_sign
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret SIGNING_PRIVATE_KEY não configurado"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$SIGNING_PRIVATE_KEY" > keys/signing-private.key
          java tools/SignDb.java sign sha256.txt
          rm -rf keys

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sha256.txt sha256.txt.sig
          git commit -m "Atualiza base de assinaturas"
          git push
